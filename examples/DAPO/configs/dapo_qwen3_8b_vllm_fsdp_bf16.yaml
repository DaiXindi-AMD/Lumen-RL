# Native LumenRL DAPO — vLLM rollout + Lumen FSDP (BF16), no verl dependency.
#
# Reproduces the verl `recipe/dapo` math RL recipe (see dapo-lumen-bf16-fp8-runbook.md)
# entirely inside LumenRL's native RLTrainer:
#   - DAPO dynamic sampling (filter_groups, acc metric, over-sampling + regen loop)
#   - asymmetric clip-higher + dual-clip PPO loss, token-mean aggregation
#   - soft overlong-buffer reward shaping
#   - token-level Truncated Importance Sampling (rollout vs training policy)
#   - vanilla upstream vLLM async rollout (calculate_log_probs=True)
#   - Lumen FSDP2 training, params loaded fp32 / mixed-precision bf16
#
# Qwen3-8B-Base, 8×MI300X/MI350X. Override paths via the launch script.

cluster:
  num_nodes: 1
  gpus_per_node: 8

policy:
  model_name: /home/danyzhan/model/qwen3-8b-base
  training_backend: fsdp2
  generation_backend: vllm
  max_total_sequence_length: 21504     # 1024 prompt + 20480 response budget
  max_response_length: 20480
  train_global_batch_size: 512         # 32 train prompts × 16 generations
  gen_batch_size: 96                   # over-sample 96 prompts/round (verl 32×3)
  train_micro_batch_size: 1
  max_token_len_per_gpu: 21504
  learning_rate: 1.0e-6
  lr_warmup_steps: 10
  weight_decay: 0.1
  max_grad_norm: 1.0
  lr_decay_style: cosine
  training:
    optimizer_dtype: bf16              # params fp32-master / FSDP mixed-precision bf16
    fsdp_cfg:
      param_offload: true
      optimizer_offload: true
  generation:
    vllm_cfg:
      gpu_memory_utilization: 0.30
      max_model_len: 21504
      dtype: bfloat16
      enforce_eager: true
      enable_chunked_prefill: true
      max_num_batched_tokens: 32768
      max_num_seqs: 64
      quantization: ""                 # BF16 rollout (no FP8)
      calculate_log_probs: true        # needed for TIS rollout correction
      temperature: 1.0
      top_p: 1.0
      top_k: -1

algorithm:
  name: dapo
  adv_estimator: grpo
  use_kl_in_reward: false
  loss_agg_mode: token-mean
  dapo:
    num_generations: 16
    kl_coeff: 0.0
    clip_ratio_low: 0.2
    clip_ratio_high: 0.28
    clip_ratio_c: 10.0
    dynamic_sampling: true
    token_level_pg: true
    overlong_reward_shaping: true
    max_resp_len: 20480
    filter_groups:
      enable: true
      metric: acc
      max_num_gen_batches: 10
    overlong_buffer:
      enable: true
      len: 4096
      penalty_factor: 1.0
      log: false

reward:
  type: function
  function: lumenrl.rewards.math_reward.dapo_math_reward
  dataset: /home/danyzhan/data/dapo-math-17k.parquet

quantization:
  rollout:
    precision: bf16
  training:
    fp8: null
  rollout_correction:
    rollout_is: token                  # token-level Truncated Importance Sampling
    rollout_is_threshold: 2.0
    rollout_is_batch_normalize: false

checkpointing:
  checkpoint_dir: /home/danyzhan/ckpts/lumenrl-dapo/vllm-fsdp-bf16
  save_steps: 20
  save_total_limit: 5
  resume: false

logger:
  wandb_enabled: false
  log_interval: 1

num_training_steps: 500
seed: 10086
